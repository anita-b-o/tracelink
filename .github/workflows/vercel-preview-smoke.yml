name: Vercel Preview Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/frontend
    env:
      PLAYWRIGHT_BASE_URL: https://tracelink-web-git-vercel-demo-anita-b-o.vercel.app
      PLAYWRIGHT_PREVIEW_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/preview-smoke.spec.ts --project=preview-smoke
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-smoke-results
          path: apps/frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
