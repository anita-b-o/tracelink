name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tracelink_test
          POSTGRES_USER: tracelink
          POSTGRES_PASSWORD: tracelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelink -d tracelink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/backend
    env:
      APP_ENV: test
      TEST_AUTH_BYPASS: "true"
      DATABASE_URL: postgresql+psycopg://tracelink:tracelink_test@localhost:5432/tracelink_test
      TEST_DATABASE_URL: postgresql+psycopg://tracelink:tracelink_test@localhost:5432/tracelink_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --no-deps --editable .
      - name: Lint and typecheck
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Validate migrations and test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          pytest
      - name: Backup and restore smoke
        working-directory: ${{ github.workspace }}
        run: |
          backup_dir="$(mktemp -d)"
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://tracelink:tracelink_test@127.0.0.1:5432/tracelink_test \
            -e BACKUP_DIR=/backup -e ALEMBIC_REVISION=0008_auth_hardening \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" -v "$backup_dir:/backup" \
            pgvector/pgvector:pg17 bash /scripts/backup.sh
          docker run --rm --network host pgvector/pgvector:pg17 \
            psql postgresql://tracelink:tracelink_test@127.0.0.1:5432/postgres \
            -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS tracelink_restore_ci' \
            -c 'CREATE DATABASE tracelink_restore_ci'
          archive="$(find "$backup_dir" -maxdepth 1 -name '*.dump' -print -quit)"
          docker run --rm --network host \
            -e RESTORE_DATABASE_URL=postgresql://tracelink:tracelink_test@127.0.0.1:5432/tracelink_restore_ci \
            -e RESTORE_CONFIRM=RESTORE \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" -v "$backup_dir:/backup" \
            pgvector/pgvector:pg17 bash /scripts/restore.sh "/backup/$(basename "$archive")"
          docker run --rm --network host pgvector/pgvector:pg17 \
            psql postgresql://tracelink:tracelink_test@127.0.0.1:5432/tracelink_restore_ci \
            -Atv ON_ERROR_STOP=1 -c "SELECT version_num FROM alembic_version" \
            -c "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname IN ('vector','pg_trgm')"
          docker run --rm --network host pgvector/pgvector:pg17 \
            psql postgresql://tracelink:tracelink_test@127.0.0.1:5432/postgres \
            -v ON_ERROR_STOP=1 -c 'DROP DATABASE tracelink_restore_ci'
          rm -rf "$backup_dir"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - run: npm test
      - run: npm run build

  workspace-e2e:
    runs-on: ubuntu-latest
    env:
      FRONTEND_PORT: 3100
      BACKEND_PORT: 8100
      POSTGRES_PORT: 55432
      REDIS_PORT: 56379
      POSTGRES_DB: tracelink_e2e
      POSTGRES_PASSWORD: tracelink_e2e
      PLAYWRIGHT_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
        working-directory: apps/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: Start isolated workspace stack
        run: >-
          docker compose -p tracelink-e2e -f compose.yaml -f compose.e2e.yaml
          up --build --detach --wait postgres redis backend worker outbox frontend
      - name: Seed review fixture
        run: >-
          docker compose -p tracelink-e2e -f compose.yaml -f compose.e2e.yaml
          run --rm e2e-fixtures
      - run: npm run test:e2e
        working-directory: apps/frontend
      - name: Show E2E logs on failure
        if: failure()
        run: docker compose -p tracelink-e2e -f compose.yaml -f compose.e2e.yaml logs --no-color
      - name: Stop isolated stack
        if: always()
        run: docker compose -p tracelink-e2e -f compose.yaml -f compose.e2e.yaml down --volumes

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error http://localhost:3000 > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/health/live > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/health/ready > /dev/null
          curl --fail --silent --show-error http://localhost:8000/openapi.json > /dev/null
      - name: Verify versioned OpenAPI contract
        run: >-
          docker compose exec -T frontend sh -c
          'npx openapi-typescript http://backend:8000/openapi.json -o /tmp/schema.d.ts
          && diff -u src/lib/api/schema.d.ts /tmp/schema.d.ts'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Audit Python dependencies and source
        working-directory: apps/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          pip-audit -r requirements.lock
          bandit -q -r src -ll
      - name: Audit frontend dependencies
        working-directory: apps/frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      AUTH_JWT_SECRET: ci-auth-secret-at-least-32-characters
      AUTH_TOKEN_PEPPER: ci-token-pepper-at-least-32-characters
      CORS_ALLOWED_ORIGINS: https://tracelink-staging.example.com
      ALLOWED_HOSTS: tracelink-api-staging.internal,backend,127.0.0.1
      METRICS_BEARER_TOKEN: ci-metrics-secret-at-least-32-chars
      OPENAI_API_KEY: ci-placeholder
      REGISTRATION_ENABLED: "true"
      IMAGE_TAG: staging
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging composition
        run: docker compose -f compose.yaml -f compose.staging.yaml config --quiet
      - name: Build production images
        run: |
          docker build --target production -f infra/docker/backend.Dockerfile -t tracelink-backend:staging .
          docker build --build-arg APP_ENV=staging --target production -f infra/docker/frontend.Dockerfile -t tracelink-frontend:staging .
      - name: Start production artifacts as staging
        run: >-
          docker compose -p tracelink-staging-ci -f compose.yaml -f compose.staging.yaml
          up --no-build --detach --wait --wait-timeout 240
      - name: Smoke staging gateway
        run: curl --fail --silent --show-error http://localhost:3000/api/health/ready > /dev/null
      - name: Show staging logs on failure
        if: failure()
        run: >-
          docker compose -p tracelink-staging-ci -f compose.yaml -f compose.staging.yaml
          logs --no-color
      - name: Stop staging stack
        if: always()
        run: >-
          docker compose -p tracelink-staging-ci -f compose.yaml -f compose.staging.yaml
          down --volumes --remove-orphans
