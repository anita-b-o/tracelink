name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tracelink_test
          POSTGRES_USER: tracelink
          POSTGRES_PASSWORD: tracelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracelink -d tracelink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://tracelink:tracelink_test@localhost:5432/tracelink_test
      TEST_DATABASE_URL: postgresql+psycopg://tracelink:tracelink_test@localhost:5432/tracelink_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --no-deps --editable .
      - name: Lint and typecheck
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Validate migrations and test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - run: npm test
      - run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify public endpoints
        run: |
          docker compose exec -T backend alembic upgrade head
          curl --fail --silent --show-error http://localhost:3000 > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/health/live > /dev/null
          curl --fail --silent --show-error http://localhost:8000/api/health/ready > /dev/null
          curl --fail --silent --show-error http://localhost:8000/openapi.json > /dev/null
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"title":"CI smoke","original_query":"Verify core domain"}' \
            http://localhost:8000/api/investigations > /tmp/investigation.json
          investigation_id=$(python -c \
            'import json; print(json.load(open("/tmp/investigation.json"))["id"])')
          curl --fail --silent --show-error --request POST \
            "http://localhost:8000/api/investigations/${investigation_id}/start" > /dev/null
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              "http://localhost:8000/api/investigations/${investigation_id}/progress" \
              > /tmp/progress.json
            percent=$(python -c \
              'import json; print(json.load(open("/tmp/progress.json"))["percent"])')
            if [ "$percent" = "100" ]; then break; fi
            sleep 1
          done
          test "$percent" = "100"
          status=$(curl --fail --silent --show-error \
            "http://localhost:8000/api/investigations/${investigation_id}" | \
            python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          test "$status" = "COMPLETED"
          curl --fail --silent --show-error http://localhost:8000/api/investigations > /dev/null
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
