envVarGroups:
  - name: tracelink-demo-auth
    envVars:
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_TOKEN_PEPPER
        generateValue: true

services:
  - type: web
    name: tracelink-demo-web
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/frontend.Dockerfile
    dockerContext: .
    dockerCommand: node server.js
    autoDeployTrigger: off
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: demo
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: tracelink-demo-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: tracelink-demo-api
    runtime: docker
    plan: free
    dockerfilePath: ./infra/docker/backend.Dockerfile
    dockerContext: .
    dockerCommand: >-
      /bin/sh -c 'alembic upgrade head && exec uvicorn tracelink.main:app
      --host 0.0.0.0 --port 8000'
    autoDeployTrigger: off
    healthCheckPath: /api/health/ready
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: tracelink-demo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tracelink-demo-redis
          property: connectionString
      - fromGroup: tracelink-demo-auth
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: tracelink-demo-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: tracelink-demo-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: COOKIE_SECURE
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: METRICS_BEARER_TOKEN
        generateValue: true
      - key: OUTBOX_BATCH_SIZE
        value: "1"
      - key: OUTBOX_MAX_ATTEMPTS
        value: "3"
      - key: OUTBOX_LEASE_SECONDS
        value: "360"
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false

  - type: keyvalue
    name: tracelink-demo-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off

databases:
  - name: tracelink-demo-db
    plan: free
    ipAllowList: []
    databaseName: tracelink_demo
    user: tracelink_demo
    postgresMajorVersion: "17"
