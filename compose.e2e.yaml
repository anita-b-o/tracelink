services:
  frontend:
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8100}
      NEXT_PUBLIC_GRAPH_MAX_NODES: 250

  backend:
    environment:
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3100}
      FAKE_RESEARCH_MODE: PIPELINE_SUCCESS
      FAKE_RESEARCH_DELAY_MS: 10

  worker:
    environment:
      ENVIRONMENT: test
      FAKE_RESEARCH_MODE: PIPELINE_SUCCESS
      FAKE_RESEARCH_DELAY_MS: 10

  e2e-fixtures:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    command: ["sh", "-c", "alembic upgrade head && python -m tracelink.e2e_seed"]
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_e2e}@postgres:5432/${POSTGRES_DB:-tracelink_e2e}
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
