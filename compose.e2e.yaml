services:
  frontend:
    build:
      target: production
      args:
        APP_ENV: test
    environment:
      APP_ENV: test
      NEXT_PUBLIC_GRAPH_MAX_NODES: 250
    volumes: !reset []

  backend:
    environment:
      APP_ENV: test
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3100}
      FAKE_RESEARCH_MODE: PIPELINE_SUCCESS
      FAKE_RESEARCH_DELAY_MS: 10
    volumes: !reset []

  worker:
    environment:
      APP_ENV: test
      FAKE_RESEARCH_MODE: PIPELINE_SUCCESS
      FAKE_RESEARCH_DELAY_MS: 10
    volumes: !reset []

  outbox:
    environment:
      APP_ENV: test
      FAKE_RESEARCH_MODE: PIPELINE_SUCCESS
    volumes: !reset []

  migrate:
    environment:
      APP_ENV: test
      DEV_BOOTSTRAP_EMAIL: e2e@example.com
      DEV_BOOTSTRAP_PASSWORD: e2e-password-secure
    volumes: !reset []

  e2e-fixtures:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    command: ["python", "-m", "tracelink.e2e_seed"]
    environment:
      APP_ENV: test
      E2E_SEED_ENABLED: "true"
      DEV_BOOTSTRAP_EMAIL: e2e@example.com
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_e2e}@postgres:5432/${POSTGRES_DB:-tracelink_e2e}
    volumes: []
    depends_on:
      postgres:
        condition: service_healthy
