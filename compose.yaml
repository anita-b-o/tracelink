name: ${COMPOSE_PROJECT_NAME:-tracelink}

services:
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    environment:
      APP_ENV: ${APP_ENV:-development}
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_GRAPH_MAX_NODES: ${NEXT_PUBLIC_GRAPH_MAX_NODES:-250}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    environment:
      APP_NAME: TraceLink API
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver,test}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-development-jwt-secret-change-me-32-bytes}
      AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-development-token-pepper-change-me-32}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      DEV_BOOTSTRAP_EMAIL: ${DEV_BOOTSTRAP_EMAIL:-dev@tracelink.local}
      DEV_BOOTSTRAP_PASSWORD: ${DEV_BOOTSTRAP_PASSWORD:-tracelink-development}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-development-metrics-token}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_dev}@postgres:5432/${POSTGRES_DB:-tracelink}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TRANSPORT_MAX_RETRIES: ${CELERY_TRANSPORT_MAX_RETRIES:-3}
      RESEARCH_TASK_MAX_ATTEMPTS: ${RESEARCH_TASK_MAX_ATTEMPTS:-3}
      FAKE_RESEARCH_DELAY_MS: ${FAKE_RESEARCH_DELAY_MS:-25}
      RESEARCH_HTTP_TIMEOUT_SECONDS: ${RESEARCH_HTTP_TIMEOUT_SECONDS:-10}
      RESEARCH_HTTP_MAX_RESPONSE_BYTES: ${RESEARCH_HTTP_MAX_RESPONSE_BYTES:-5000000}
      RESEARCH_HTTP_MAX_REDIRECTS: ${RESEARCH_HTTP_MAX_REDIRECTS:-5}
      RESEARCH_HTTP_USER_AGENT: ${RESEARCH_HTTP_USER_AGENT:-TraceLink/0.1 ResearchConnector}
      RESEARCH_WEB_SEARCH_MAX_RESULTS: ${RESEARCH_WEB_SEARCH_MAX_RESULTS:-10}
      RESEARCH_CACHE_TTL_SECONDS: ${RESEARCH_CACHE_TTL_SECONDS:-3600}
      RESEARCH_CONNECTOR_REQUESTS_PER_SECOND: ${RESEARCH_CONNECTOR_REQUESTS_PER_SECOND:-2}
      ENTITY_EXTRACTION_CHUNK_SIZE: ${ENTITY_EXTRACTION_CHUNK_SIZE:-4000}
      ENTITY_EXTRACTION_CHUNK_OVERLAP: ${ENTITY_EXTRACTION_CHUNK_OVERLAP:-300}
      ENTITY_RESOLUTION_AUTO_MATCH_THRESHOLD: ${ENTITY_RESOLUTION_AUTO_MATCH_THRESHOLD:-0.90}
      ENTITY_RESOLUTION_POSSIBLE_MATCH_THRESHOLD: ${ENTITY_RESOLUTION_POSSIBLE_MATCH_THRESHOLD:-0.65}
      RELATIONSHIP_AUTO_ACCEPT_THRESHOLD: ${RELATIONSHIP_AUTO_ACCEPT_THRESHOLD:-0.90}
      RELATIONSHIP_POSSIBLE_THRESHOLD: ${RELATIONSHIP_POSSIBLE_THRESHOLD:-0.65}
      RELATIONSHIP_MAX_CANDIDATES_PER_DOCUMENT: ${RELATIONSHIP_MAX_CANDIDATES_PER_DOCUMENT:-100}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1600}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-10}
      RAG_SEMANTIC_WEIGHT: ${RAG_SEMANTIC_WEIGHT:-0.70}
      RAG_LEXICAL_WEIGHT: ${RAG_LEXICAL_WEIGHT:-0.30}
      RAG_MIN_RETRIEVAL_SCORE: ${RAG_MIN_RETRIEVAL_SCORE:-0.20}
      RAG_MIN_EVIDENCE_COUNT: ${RAG_MIN_EVIDENCE_COUNT:-1}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-24000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    user: tracelink
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    command:
      [
        "celery",
        "--app",
        "tracelink.jobs.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--hostname=worker@%h",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_dev}@postgres:5432/${POSTGRES_DB:-tracelink}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CELERY_TRANSPORT_MAX_RETRIES: ${CELERY_TRANSPORT_MAX_RETRIES:-3}
      RESEARCH_TASK_MAX_ATTEMPTS: ${RESEARCH_TASK_MAX_ATTEMPTS:-3}
      FAKE_RESEARCH_DELAY_MS: ${FAKE_RESEARCH_DELAY_MS:-25}
      RESEARCH_HTTP_TIMEOUT_SECONDS: ${RESEARCH_HTTP_TIMEOUT_SECONDS:-10}
      RESEARCH_HTTP_MAX_RESPONSE_BYTES: ${RESEARCH_HTTP_MAX_RESPONSE_BYTES:-5000000}
      RESEARCH_HTTP_MAX_REDIRECTS: ${RESEARCH_HTTP_MAX_REDIRECTS:-5}
      RESEARCH_HTTP_USER_AGENT: ${RESEARCH_HTTP_USER_AGENT:-TraceLink/0.1 ResearchConnector}
      RESEARCH_WEB_SEARCH_MAX_RESULTS: ${RESEARCH_WEB_SEARCH_MAX_RESULTS:-10}
      RESEARCH_CACHE_TTL_SECONDS: ${RESEARCH_CACHE_TTL_SECONDS:-3600}
      RESEARCH_CONNECTOR_REQUESTS_PER_SECOND: ${RESEARCH_CONNECTOR_REQUESTS_PER_SECOND:-2}
      ENTITY_EXTRACTION_CHUNK_SIZE: ${ENTITY_EXTRACTION_CHUNK_SIZE:-4000}
      ENTITY_EXTRACTION_CHUNK_OVERLAP: ${ENTITY_EXTRACTION_CHUNK_OVERLAP:-300}
      ENTITY_RESOLUTION_AUTO_MATCH_THRESHOLD: ${ENTITY_RESOLUTION_AUTO_MATCH_THRESHOLD:-0.90}
      ENTITY_RESOLUTION_POSSIBLE_MATCH_THRESHOLD: ${ENTITY_RESOLUTION_POSSIBLE_MATCH_THRESHOLD:-0.65}
      RELATIONSHIP_AUTO_ACCEPT_THRESHOLD: ${RELATIONSHIP_AUTO_ACCEPT_THRESHOLD:-0.90}
      RELATIONSHIP_POSSIBLE_THRESHOLD: ${RELATIONSHIP_POSSIBLE_THRESHOLD:-0.65}
      RELATIONSHIP_MAX_CANDIDATES_PER_DOCUMENT: ${RELATIONSHIP_MAX_CANDIDATES_PER_DOCUMENT:-100}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1600}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-10}
      RAG_SEMANTIC_WEIGHT: ${RAG_SEMANTIC_WEIGHT:-0.70}
      RAG_LEXICAL_WEIGHT: ${RAG_LEXICAL_WEIGHT:-0.30}
      RAG_MIN_RETRIEVAL_SCORE: ${RAG_MIN_RETRIEVAL_SCORE:-0.20}
      RAG_MIN_EVIDENCE_COUNT: ${RAG_MIN_EVIDENCE_COUNT:-1}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-24000}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    user: tracelink
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app tracelink.jobs.celery_app:celery_app inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15s

  outbox:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    command: ["python", "-m", "tracelink.outbox_dispatcher"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_dev}@postgres:5432/${POSTGRES_DB:-tracelink}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    user: tracelink
    volumes:
      - ./apps/backend:/app
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/tracelink-outbox-ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    command: ["sh", "-c", "alembic upgrade head && python -m tracelink.maintenance bootstrap-dev-user"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tracelink}:${POSTGRES_PASSWORD:-tracelink_dev}@postgres:5432/${POSTGRES_DB:-tracelink}
      DEV_BOOTSTRAP_EMAIL: ${DEV_BOOTSTRAP_EMAIL:-dev@tracelink.local}
      DEV_BOOTSTRAP_PASSWORD: ${DEV_BOOTSTRAP_PASSWORD:-tracelink-development}
    volumes:
      - ./apps/backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracelink}
      POSTGRES_USER: ${POSTGRES_USER:-tracelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracelink_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  frontend_next:
  frontend_node_modules:
  postgres_data:
  redis_data:
