[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelink-backend"
version = "0.1.0"
description = "TraceLink OSINT research API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18,<2",
  "beautifulsoup4>=4.14,<5",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.12,<3",
  "redis>=6.4,<6.5",
  "sqlalchemy>=2.0.46,<3",
  "uvicorn[standard]>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pip-tools>=7.5,<8",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracelink = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires a real PostgreSQL server with pgvector",
  "celery_smoke: requires a real Redis broker and Celery worker process",
  "real_smoke: performs a small request against stable public Internet sources",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tracelink"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
